const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Opening…"; msg.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(SALT), iterations: ROUNDS, hash: "SHA-256" }, base,
      { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(IV) }, key, unb64(document.getElementById("payload").textContent.trim()));
    const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = window.crypto && crypto.subtle ? "That passkey didn't work. Check it and try again." : "This browser can't open protected pages. Please use a current version of Chrome, Edge, Firefox or Safari.";
    btn.disabled = false; btn.textContent = "Open dashboard";
  }
});
</script></body></html>
